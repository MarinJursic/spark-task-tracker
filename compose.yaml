services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spark_tasks
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_tasks"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - spark-postgres-data:/var/lib/postgresql/data

volumes:
  spark-postgres-data:
